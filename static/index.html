<!DOCTYPE html>
<!-- M12 前端：AI 面试官会话页（零构建：原生 HTML + CSS + JS，fetch 调后端 API）
     对接接口：POST /interview/graph/start、GET /{thread_id}、POST /{thread_id}/answer、POST /{thread_id}/approval
     状态机：waiting_answer（答题）→ waiting_approval（审批）→ finished（终评） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 面试官</title>
<style>
  /* 全局：简洁亮色风格，卡片式布局 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f0f2f5; color: #1f2329; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #86909c; font-size: 13px; margin-bottom: 20px; }
  .sub a { color: #3370ff; text-decoration: none; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(31,35,41,.08); }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #4e5969; margin: 10px 0 4px; }
  input, textarea { width: 100%; border: 1px solid #d4d7dc; border-radius: 6px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: #3370ff; }
  button { border: none; border-radius: 6px; padding: 9px 20px; font-size: 14px; cursor: pointer; background: #3370ff; color: #fff; }
  button:hover { background: #2860e1; }
  button:disabled { background: #a9c4ff; cursor: not-allowed; }
  button.ghost { background: #f2f3f5; color: #1f2329; }
  button.ghost:hover { background: #e5e6eb; }
  button.danger { background: #f53f3f; }
  button.danger:hover { background: #d92d2d; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .hidden { display: none; }
  /* 优先级修正：ID 选择器(#loading)压过 class 选择器(.hidden)，必须用更高特异度才能隐藏遮罩 */
  #loading.hidden { display: none; }
  /* 状态徽章 */
  .badge { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  .badge.answer  { background: #e8f3ff; color: #3370ff; }
  .badge.approve { background: #fff3e8; color: #d25f00; }
  .badge.done    { background: #e8ffea; color: #00b42a; }
  /* 题目与评估 */
  .question { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .meta { font-size: 13px; color: #86909c; margin-top: 8px; }
  .score { font-size: 28px; font-weight: 700; color: #3370ff; }
  .comment { font-size: 14px; line-height: 1.6; color: #4e5969; margin-top: 6px; }
  /* 历史记录 */
  .qa { border-top: 1px solid #f0f2f5; padding: 12px 0; font-size: 13px; }
  .qa .q { font-weight: 600; margin-bottom: 4px; }
  .qa .a { color: #4e5969; white-space: pre-wrap; }
  .qa .c { color: #86909c; margin-top: 4px; }
  .expand { color: #3370ff; cursor: pointer; margin-left: 6px; }
  /* 加载遮罩：提交回答/审批后后端要跑完整一轮 LLM，耗时 10-60 秒 */
  #loading { position: fixed; inset: 0; background: rgba(255,255,255,.72); display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; z-index: 9; }
  .spinner { width: 34px; height: 34px; border: 3px solid #d4d7dc; border-top-color: #3370ff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: #1f2329; color: #fff; padding: 9px 18px; border-radius: 6px; font-size: 13px; display: none; z-index: 99; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 面试官</h1>
  <div class="sub">LangGraph 版 · <a href="/static/questions.html">题库管理</a> · <a href="/docs">API 文档</a></div>

  <!-- 开始面试表单：仅在无进行中会话时显示 -->
  <div class="card" id="startCard">
    <h2>开始一场新面试</h2>
    <label>候选人姓名</label>
    <input id="nameInput" placeholder="如：小测">
    <label>面试岗位</label>
    <input id="posInput" placeholder="如：Python 后端">
    <div class="row">
      <button id="startBtn" onclick="startInterview()">发起面试</button>
      <button class="ghost" onclick="resumeById()">恢复已有会话</button>
    </div>
  </div>

  <!-- 会话卡片：状态驱动渲染 -->
  <div class="card hidden" id="sessionCard">
    <h2>会话 <span id="tidText" style="font-weight:400;color:#86909c"></span> <span class="badge" id="statusBadge"></span></h2>
    <div class="meta" id="sessionMeta"></div>

    <!-- 当前题目 -->
    <div class="card" style="margin:14px 0 0; box-shadow:none; background:#f7f8fa" id="questionCard">
      <div class="question" id="questionText"></div>
    </div>

    <!-- 答题区（waiting_answer） -->
    <div id="answerArea">
      <label>你的回答</label>
      <textarea id="answerInput" placeholder="结构清晰、要点全面，代码块会被沙箱真实执行…"></textarea>
      <div class="row"><button id="submitBtn" onclick="submitAnswer()">提交回答</button></div>
    </div>

    <!-- 审批区（waiting_approval） -->
    <div class="card hidden" id="approvalCard" style="margin-top:14px; box-shadow:none; background:#fff7e8">
      <h2>评估官建议结束面试并生成终评（不可逆动作）</h2>
      <div class="row">
        <button onclick="submitApproval(true)">批准，生成终评</button>
        <button class="danger" onclick="submitApproval(false)">驳回，继续面试</button>
      </div>
    </div>

    <!-- 最近一轮评估 -->
    <div class="card hidden" id="scoreCard" style="margin-top:14px; box-shadow:none; background:#f7f8fa">
      <span class="score" id="scoreText"></span>
      <div class="comment" id="commentText"></div>
    </div>

    <!-- 终评报告（finished） -->
    <div class="card hidden" id="summaryCard" style="margin-top:14px; box-shadow:none; background:#e8ffea">
      <h2>终评报告</h2>
      <div class="comment" style="white-space:pre-wrap" id="summaryText"></div>
    </div>

    <!-- 问答历史 -->
    <div class="card hidden" id="historyCard" style="margin-top:14px; box-shadow:none">
      <h2>问答历史</h2>
      <div id="historyList"></div>
    </div>
  </div>
</div>

<div id="loading" class="hidden"><div class="spinner"></div><div id="loadingText">请求中…</div></div>
<div id="toast"></div>

<script>
"use strict";
/** 本地存储键：刷新页面后凭 thread_id 恢复会话（检查点在服务端 SQLite，安全恢复） */
const TID_KEY = "interview_thread_id";

/** 通用请求封装：统一 JSON 头、错误提示、加载遮罩 */
async function api(path, body, loadingText) {
  showLoading(loadingText || "请求中…");
  try {
    const resp = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (!resp.ok) {
      // FastAPI 错误响应是 {detail: "..."}，直接透出给用户
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      throw new Error(err.detail || JSON.stringify(err));
    }
    return await resp.json();
  } finally { hideLoading(); }
}

/** 显示/隐藏加载遮罩（提交回答后端要跑完整一轮 LLM，必须给等待反馈） */
function showLoading(text) { document.getElementById("loadingText").textContent = text; document.getElementById("loading").classList.remove("hidden"); }
function hideLoading() { document.getElementById("loading").classList.add("hidden"); }

/** 轻提示（3 秒自动消失） */
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.display = "block";
  setTimeout(() => el.style.display = "none", 3000);
}

/** 发起面试：POST /start，保存 thread_id 后渲染快照 */
async function startInterview() {
  const candidate_name = document.getElementById("nameInput").value.trim();
  const position = document.getElementById("posInput").value.trim();
  if (!candidate_name || !position) { toast("请填写姓名和岗位"); return; }
  try {
    const snap = await api("/interview/graph/start", { candidate_name, position }, "发起面试中：规划官正在准备第一题…");
    localStorage.setItem(TID_KEY, snap.thread_id);
    render(snap);
  } catch (e) { toast("发起失败：" + e.message); }
}

/** 恢复已有会话：凭 localStorage 的 thread_id 读检查点快照 */
async function resumeById() {
  const tid = localStorage.getItem(TID_KEY);
  if (!tid) { toast("本地没有进行中的会话"); return; }
  try { render(await api("/interview/graph/" + tid)); }
  catch (e) { toast("恢复失败：" + e.message); localStorage.removeItem(TID_KEY); }
}

/** 提交回答：图会跑完 评估→出下一题 全程，耗时较长 */
async function submitAnswer() {
  const answer = document.getElementById("answerInput").value.trim();
  if (!answer) { toast("请先填写回答"); return; }
  const tid = localStorage.getItem(TID_KEY);
  try {
    render(await api(`/interview/graph/${tid}/answer`, { answer }, "评估官打分 + 规划下一题中（约 10-60 秒）…"));
    document.getElementById("answerInput").value = "";
  } catch (e) { toast("提交失败：" + e.message); }
}

/** 人工审批：true 批准生成终评 / false 驳回继续面试 */
async function submitApproval(approved) {
  const tid = localStorage.getItem(TID_KEY);
  try {
    render(await api(`/interview/graph/${tid}/approval`, { approved },
      approved ? "生成终评报告中…" : "驳回：规划官重新规划中…"));
  } catch (e) { toast("审批失败：" + e.message); }
}

/** 状态驱动的核心渲染：按快照 status 切换各区块显隐 */
function render(snap) {
  document.getElementById("startCard").classList.add("hidden");
  document.getElementById("sessionCard").classList.remove("hidden");
  document.getElementById("tidText").textContent = snap.thread_id;

  // 状态徽章
  const badge = document.getElementById("statusBadge");
  const badges = { waiting_answer: ["answer", "等待回答"], waiting_approval: ["approve", "等待审批"], finished: ["done", "已结束"] };
  const [cls, text] = badges[snap.status] || ["answer", snap.status];
  badge.className = "badge " + cls; badge.textContent = text;
  document.getElementById("sessionMeta").textContent =
    `${snap.candidate_name || ""} · ${snap.position || ""} · 第 ${snap.round_count} 轮`;

  // 当前题目（结束后的最后一题仍显示，供回看）
  document.getElementById("questionText").textContent = snap.current_question || "（无）";

  // 按状态切换交互区
  document.getElementById("answerArea").classList.toggle("hidden", snap.status !== "waiting_answer");
  document.getElementById("approvalCard").classList.toggle("hidden", snap.status !== "waiting_approval");

  // 最近评估
  const hasScore = snap.last_score !== null && snap.last_score !== undefined;
  document.getElementById("scoreCard").classList.toggle("hidden", !hasScore);
  if (hasScore) {
    document.getElementById("scoreText").textContent = snap.last_score + " 分";
    document.getElementById("commentText").textContent = snap.last_comment || "";
  }

  // 终评
  const done = snap.status === "finished";
  document.getElementById("summaryCard").classList.toggle("hidden", !(done && snap.summary));
  document.getElementById("summaryText").textContent = snap.summary || "";

  // 问答历史（每轮：题/分/评语；回答原文较长默认截断，点击展开）
  const history = snap.history || [];
  document.getElementById("historyCard").classList.toggle("hidden", history.length === 0);
  document.getElementById("historyList").innerHTML = history.map((qa, i) => {
    const long = qa.answer.length > 200;
    return `
    <div class="qa">
      <div class="q">${i + 1}. [${qa.score} 分] ${esc(qa.question)}</div>
      <div class="a">答：${esc(long ? qa.answer.slice(0, 200) + "…" : qa.answer)}${long ? `<span class="expand" data-full="${esc(qa.answer)}" onclick="expandAnswer(this)">展开</span>` : ""}</div>
      <div class="c">评：${esc(qa.comment)}</div>
    </div>`;
  }).join("");
}

/** 展开某条历史回答：完整内容经 esc 转义存在 data-full 属性里（不拼进 onclick 字符串，防引号炸裂与 XSS） */
function expandAnswer(el) {
  el.closest(".a").innerHTML = "答：" + esc(el.dataset.full);
}

/** HTML 转义：历史内容含候选人输入，防 XSS */
function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/** 页面加载时自动尝试恢复上次会话 */
window.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem(TID_KEY)) resumeById();
});
</script>
</body>
</html>
